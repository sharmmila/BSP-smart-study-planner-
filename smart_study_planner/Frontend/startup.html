<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskTales — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #b3b49a;
      font-family: 'Jost', sans-serif;
      padding: 2rem;
    }

    .auth-wrap {
      display: flex;
      width: 100%;
      max-width: 860px;
      min-height: 580px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 80px #1c290d19;
    }

    /* ── Left Panel ── */
    .auth-left {
      flex: 1.1;
      background: #676f53;
      padding: 3rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .auth-left::before {
      content: '';
      position: absolute;
      top: -80px;
      left: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      border: 0.5px solid rgba(210, 186, 140, 0.29);
    }

    .auth-left::after {
      content: '';
      position: absolute;
      bottom: -60px;
      right: -60px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 0.5px solid rgba(210,185,140,0.10);
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(210,185,140,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-inner {
      width: 10px;
      height: 10px;
      background: #d2b98c;
      border-radius: 50%;
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 17px;
      color: #f0e8d8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .auth-left-copy {
      z-index: 1;
    }

    .auth-left-copy h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 40px;
      color: #f0e8d8;
      line-height: 1.2;
      margin-bottom: 1rem;
      font-style: italic;
    }

    .auth-left-copy p {
      font-size: 13px;
      font-weight: 300;
      color: rgba(210,185,140,0.75);
      line-height: 1.8;
      letter-spacing: 0.03em;
    }

    .auth-left-footer {
      font-size: 11px;
      color: rgba(210,185,140,0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 1;
    }

    /* ── Right Panel ── */
    .auth-right {
      flex: 1;
      padding: 2.8rem 2.5rem;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tab-row {
      display: flex;
      border-bottom: 0.5px solid #e0ddd6;
      margin-bottom: 2rem;
    }

    .tab {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      color: #999;
      padding: 0 0 12px;
      margin-right: 2rem;
      cursor: pointer;
      border-bottom: 1.5px solid transparent;
      margin-bottom: -0.5px;
      transition: color 0.2s;
      background: none;
      border-left: none;
      border-right: none;
      border-top: none;
    }

    .tab.active {
      color: #1a1a18;
      border-bottom-color: #d2b98c;
    }

    .form-section { display: none; }
    .form-section.visible { display: block; }

    .field { margin-bottom: 1.2rem; }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 0.5px solid #ccc;
      padding: 8px 0;
      font-family: 'Jost', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #1a1a18;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus { border-bottom-color: #d2b98c; }
    .field input::placeholder { color: #bbb; }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .forgot {
      font-size: 11px;
      text-align: right;
      letter-spacing: 0.06em;
      color: #888;
      margin-bottom: 1.8rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .forgot:hover { color: #d2b98c; }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: #0f0e0c;
      color: #f0e8d8;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 400;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.82; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 1.4rem 0;
    }

    .divider-line { flex: 1; height: 0.5px; background: #e0ddd6; }

    .divider-text {
      font-size: 11px;
      color: #bbb;
      letter-spacing: 0.08em;
    }

    .btn-social {
      width: 100%;
      padding: 11px;
      background: transparent;
      border: 0.5px solid #ddd;
      color: #666;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-social:hover { border-color: #bbb; color: #333; }

    .terms {
      font-size: 11px;
      color: #aaa;
      margin-top: 1.2rem;
      text-align: center;
      line-height: 1.7;
      letter-spacing: 0.02em;
    }

    .terms a {
      color: #888;
      text-decoration: none;
      transition: color 0.2s;
    }

    .terms a:hover { color: #d2b98c; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body { padding: 0; }
      .auth-wrap { border-radius: 0; min-height: 100vh; flex-direction: column; }
      .auth-left { flex: none; padding: 2rem 1.8rem; min-height: 200px; }
      .auth-left-copy h1 { font-size: 30px; }
      .auth-right { padding: 2rem 1.8rem; }
    }
  </style>
</head>
<body>

  <div class="auth-wrap">

    <!-- Left Panel -->
    <div class="auth-left">
      <div class="brand-mark">
        <div class="brand-logo"><div class="brand-logo-inner"></div></div>
        <div class="brand-name">TaskTales</div>
      </div>

      <div class="auth-left-copy">
        <h1>Plan. Play. Progress.<br>
        <p>Turn your daily study routine into a rewarding system.<br>into a rewarding system.</p>
      </div>

      <div class="auth-left-footer">Est. 2019 &nbsp;&middot;&nbsp; Luxembourg</div>
    </div>

    <!-- Right Panel -->
    <div class="auth-right">

      <div class="tab-row">
        <button class="tab active" id="tab-login" onclick="switchTab('login')">Sign in</button>
        <button class="tab" id="tab-signup" onclick="switchTab('signup')">Create account</button>
      </div>

      <!-- Login Form -->
      <div class="form-section visible" id="form-login">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="forgot">Forgot password?</div>
        <!--This button switches to our other html file-->
        <button class="btn-primary" onclick="window.location.href='calendartest.html'">Sign In</button>

        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-text">or</div>
          <div class="divider-line"></div>
        </div>

        <button class="btn-social">
          <svg width="14" height="14" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.013 17.64 11.706 17.64 9.2z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- Signup Form -->
      <div class="form-section" id="form-signup">
        <div class="row2">
          <div class="field">
            <label for="signup-first">First name</label>
            <input id="signup-first" type="text" placeholder="Ada" autocomplete="given-name" />
          </div>
          <div class="field">
            <label for="signup-last">Last name</label>
            <input id="signup-last" type="text" placeholder="Lovelace" autocomplete="family-name" />
          </div>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" />
        </div>
        <!--This button switches to our other html file-->
        <button class="btn-primary" style="margin-top: 0.4rem;" onclick="window.location.href='calendartest.html'">Create Account</button>
        <div class="terms">
          By creating an account you agree to our
          <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
        </div>
      </div>

    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('visible'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('form-' + tab).classList.add('visible');
    }
  </script>


</body>
</html>
